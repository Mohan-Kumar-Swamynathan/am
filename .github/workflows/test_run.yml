name: Test Run

on:
  push:
    branches: [main]
    paths: ['aalaya_mani_bot.py', '.github/workflows/test_run.yml']
  workflow_dispatch:

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-genai groq edge-tts google-api-python-client google-auth-oauthlib requests beautifulsoup4 Pillow

      - name: Check secrets
        run: |
          echo "GEMINI_KEY set: $([ -n '${{ secrets.GEMINI_KEY }}' ] && echo YES || echo NO)"
          echo "YOUTUBE_TOKEN set: $([ -n '${{ secrets.YOUTUBE_TOKEN_BASE64 }}' ] && echo YES || echo NO)"

      - name: Generate image
        run: |
          python3 -c "
from PIL import Image, ImageDraw
img = Image.new('RGB', (1920, 1080), color=(20, 15, 40))
d = ImageDraw.Draw(img)
d.ellipse([810, 390, 1110, 690], fill=(40, 30, 60), outline=(200, 170, 50))
img.save('image.png')
print('image.png created')
"

      - name: Generate BGM
        run: |
          ffmpeg -y -f lavfi -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" \
            -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" \
            bgm.mp3 2>/dev/null
          echo "bgm.mp3 created"

      - name: Generate video
        run: python3 aalaya_mani_bot.py --day today --image image.png

      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
          echo "=== Scripts ===" && ls -lh scripts/ 2>/dev/null || echo "none"
          echo "=== Metadata ===" && cat metadata/*.txt 2>/dev/null | head -20 || echo "none"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            videos/
            shorts/
            metadata/
            scripts/
