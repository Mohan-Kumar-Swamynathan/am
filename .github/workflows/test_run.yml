name: Test Run

on:
  push:
    branches: [main]
    paths:
      - "aalaya_mani_bot.py"
      - "analytics.py"
      - "diversity.py"
      - "retention.py"
      - "image_quality.py"
      - "media/**"
      - "watermark.py"
      - "thumbnail_engine.py"
      - "shorts_generator.py"
      - "utils/**"
      - "requirements.txt"
      - ".github/workflows/test_run.yml"
  workflow_dispatch:

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GITHUB_TOKEN:           ${{ secrets.GH_PAT_TOKEN }}
  CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto
          pip install --quiet -r requirements.txt
          # Make pip scripts available in PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          which ffmpeg && ffmpeg -version | head -1
          which edge-tts && edge-tts --version || echo "edge-tts path: $(python3 -c 'import shutil; print(shutil.which(\"edge-tts\"))')"
          python3 -c "import google.genai; print('google-genai OK')"
          python3 -c "import groq; print('groq OK')" || echo "groq not installed (OK if using Gemini)"

      - name: Check secrets
        run: |
          echo "GEMINI_KEY set:     ${{ secrets.GEMINI_KEY != '' }}"
          echo "GROQ_API_KEY set:   ${{ secrets.GROQ_API_KEY != '' }}"
          echo "PEXELS_API_KEY set: ${{ secrets.PEXELS_API_KEY != '' }}"
          if [ -z "$GEMINI_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GITHUB_TOKEN" ] && [ -z "$CEREBRAS_API_KEY" ]; then
            echo "ERROR: No free LLM key set (need GROQ_API_KEY, GEMINI_KEY, GH_PAT_TOKEN, or CEREBRAS_API_KEY)."
            exit 1
          fi

      - name: Setup assets
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1920, 1080), color=(20,15,40))
          d = ImageDraw.Draw(img)
          d.ellipse([810,390,1110,690], fill=(40,30,60), outline=(200,170,50))
          img.save('image.png')
          print('image.png created')
          "
          ffmpeg -y -f lavfi -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" \
            -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" \
            bgm.mp3 2>/dev/null
          echo "bgm.mp3 created"

      - name: Generate video (no upload)
        run: |
          set -o pipefail
          python3 aalaya_mani_bot.py --day today --image image.png 2>&1 | tee /tmp/daily_bot.log

      - name: Verify image quality logs
        run: |
          grep -E "real_photos=[0-9]+" /tmp/daily_bot.log || echo "WARNING: real_photos metric missing"
          REAL=$(grep -oE "real_photos=[0-9]+" /tmp/daily_bot.log | tail -1 | cut -d= -f2 || echo 0)
          echo "real_photos=$REAL"
          if [ "${REAL:-0}" -lt 1 ]; then
            echo "WARNING: fewer than 1 real photo — check image sources"
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
          echo "=== Scripts ===" && cat scripts/*.txt 2>/dev/null | head -20 || echo "none"
          echo "=== Pexels images ===" && find pexels_images/ -name "*.jpg" 2>/dev/null | wc -l || echo "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ github.run_number }}
          path: |
            videos/
            shorts/
            metadata/
            scripts/
            thumbnails/
          retention-days: 7
