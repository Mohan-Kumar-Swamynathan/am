name: Manual Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: today/trending/all/test"
        required: true
        default: test
        type: string
      topic:
        description: "Custom topic (optional)"
        required: false
        type: string
      upload:
        description: "Upload to YouTube? yes/no"
        required: false
        default: "no"
        type: string

permissions:
  contents: write

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
  CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-genai groq edge-tts google-api-python-client google-auth-oauthlib requests beautifulsoup4 Pillow schedule
      - name: Setup assets
        run: |
          python3 -c "from PIL import Image,ImageDraw; img=Image.new('RGB',(1920,1080),(20,15,40)); d=ImageDraw.Draw(img); d.ellipse([810,390,1110,690],fill=(40,30,60),outline=(200,170,50)); img.save('image.png')" || true
          test -f bgm.mp3 || ffmpeg -y -f lavfi -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" bgm.mp3 2>/dev/null
      - name: Restore YouTube token
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle; fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json; fi
      - name: Run bot
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TOPIC="${{ github.event.inputs.topic }}"
          UPLOAD="${{ github.event.inputs.upload }}"
          UPLOAD_FLAG=""
          if [ "$UPLOAD" = "yes" ]; then UPLOAD_FLAG="--upload"; fi
          if [ -n "$TOPIC" ]; then
            python3 aalaya_mani_bot.py --topic "$TOPIC" --output custom --image image.png $UPLOAD_FLAG
          elif [ "$MODE" = "trending" ]; then
            python3 aalaya_mani_bot.py --trending --image image.png $UPLOAD_FLAG
          elif [ "$MODE" = "all" ]; then
            python3 aalaya_mani_bot.py --day all --image image.png $UPLOAD_FLAG
          else
            python3 aalaya_mani_bot.py --day today --image image.png $UPLOAD_FLAG
          fi
      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-output
          path: |
            videos/
            shorts/
            metadata/
            scripts/
          retention-days: 7
