name: Manual Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        required: true
        default: today
        type: string
      topic:
        description: Custom topic
        required: false
        type: string
      privacy:
        description: Privacy
        required: false
        default: unlisted
        type: string

permissions:
  contents: write

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
  CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet google-genai groq edge-tts google-api-python-client google-auth-oauthlib requests beautifulsoup4 Pillow
      - name: Restore YouTube token
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle; fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json; fi
      - name: Run bot
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TOPIC="${{ github.event.inputs.topic }}"
          PRIVACY="${{ github.event.inputs.privacy }}"
          if [ -n "$TOPIC" ]; then
            python3 aalaya_mani_bot.py --topic "$TOPIC" --output custom --privacy "$PRIVACY" --upload
          elif [ "$MODE" = "full" ]; then
            python3 aalaya_mani_bot.py --day today --privacy "$PRIVACY" --upload
            python3 aalaya_mani_bot.py --trending --privacy "$PRIVACY" --upload
          elif [ "$MODE" = "all" ]; then
            python3 aalaya_mani_bot.py --day all --privacy "$PRIVACY" --upload
          elif [ "$MODE" = "upload" ]; then
            python3 aalaya_mani_bot.py --upload-pending --privacy "$PRIVACY"
          elif [ "$MODE" = "trending" ]; then
            python3 aalaya_mani_bot.py --trending --privacy "$PRIVACY" --upload
          else
            python3 aalaya_mani_bot.py --day today --privacy "$PRIVACY" --upload
          fi
