name: Daily Video

on:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST   # 21:17 UTC = 02:47 IST
    - cron: "0 16 * * *"  # 21:30 IST   # 13:47 UTC = 19:17 IST
  workflow_dispatch:

permissions:
  contents: write

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
  GITHUB_TOKEN:           ${{ secrets.GH_PAT_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
  CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
  SLEEP_PLAYLIST_ID:     ${{ secrets.SLEEP_PLAYLIST_ID }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto
          pip install --quiet google-genai groq edge-tts openai \
            google-api-python-client google-auth-oauthlib \
            requests beautifulsoup4 Pillow schedule
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          echo "=== Tool paths ==="
          which ffmpeg   && ffmpeg -version | head -1
          which ffprobe  && ffprobe -version | head -1
          which edge-tts && edge-tts --version || echo "WARNING: edge-tts not in PATH"
          python3 -c "import shutil; print('edge-tts via python:', shutil.which('edge-tts'))"
          echo "=== Python packages ==="
          python3 -c "import google.genai; print('google-genai OK')"
          python3 -c "import groq; print('groq OK')" || echo "groq not installed"
          python3 -c "import edge_tts; print('edge_tts module OK')"
          echo "=== Secrets check ==="
          echo "GEMINI_KEY set:           ${{ secrets.GEMINI_KEY != '' }}"
          echo "GROQ_API_KEY set:         ${{ secrets.GROQ_API_KEY != '' }}"
          echo "PEXELS_API_KEY set:       ${{ secrets.PEXELS_API_KEY != '' }}"
          echo "YOUTUBE_TOKEN_BASE64 set: ${{ secrets.YOUTUBE_TOKEN_BASE64 != '' }}"
          if [ -z "$GEMINI_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: No LLM key set."
            exit 1
          fi

      - name: Setup assets
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1920, 1080), (20, 15, 40))
          d = ImageDraw.Draw(img)
          d.ellipse([810,390,1110,690], fill=(40,30,60), outline=(200,170,50))
          img.save('image.png')
          print('image.png created')
          " || true
          test -f bgm.mp3 || ffmpeg -y -f lavfi \
            -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" \
            -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" \
            bgm.mp3 2>/dev/null && echo "bgm.mp3 created"

      - name: Restore YouTube token
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle
            echo "youtube_token.pickle restored ($(wc -c < youtube_token.pickle) bytes)"
          else
            echo "WARNING: YOUTUBE_TOKEN_BASE64 not set — upload will be skipped"
          fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then
            echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
            echo "client_secrets.json restored"
          fi


      - name: Debug YouTube token
        run: |
          echo "=== Token debug ==="
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "TOKEN_B64_LEN=$(echo -n $YOUTUBE_TOKEN_BASE64 | wc -c)"
            python3 << 'HEREDOC'
import pickle, os, base64, sys
b64 = os.environ.get('YOUTUBE_TOKEN_BASE64', '')
try:
    creds = pickle.loads(base64.b64decode(b64))
    print(f"  creds_type={type(creds).__name__}")
    print(f"  valid={creds.valid}")
    print(f"  expired={creds.expired}")
    print(f"  has_refresh_token={bool(creds.refresh_token)}")
    print(f"  expiry={getattr(creds,'expiry',None)}")
    if creds.expired and creds.refresh_token:
        from google.auth.transport.requests import Request
        creds.refresh(Request())
        with open('youtube_token.pickle','wb') as f: pickle.dump(creds,f)
        print("  TOKEN_REFRESHED=true")
    elif not creds.valid and not creds.refresh_token:
        print("  ERROR=token_invalid_no_refresh_reauth_needed")
    else:
        print("  TOKEN_STATUS=valid_ready")
except Exception as e:
    print(f"  DECODE_ERROR={e}")
HEREDOC
          else
            echo "ERROR: YOUTUBE_TOKEN_BASE64 secret is EMPTY or not set"
          fi


      - name: Generate and upload
        run: |
          if [ -f youtube_token.pickle ]; then
            python3 aalaya_mani_bot.py --day today --image image.png --upload || echo "⚠️ Bot error — check annotations"
          else
            echo "No YouTube token — generating video only"
            python3 aalaya_mani_bot.py --day today --image image.png || echo "⚠️ Bot error — check annotations"
          fi


      - name: Generate sleep music
        run: |
          if [ -f youtube_token.pickle ]; then
            python3 aalaya_mani_bot.py --sleep --upload || echo "⚠️ Sleep music error"
          else
            python3 aalaya_mani_bot.py --sleep || echo "⚠️ Sleep music error"
          fi


      - name: Create sleep playlist (once)
        run: python3 create_sleep_playlist.py || echo "Playlist step failed — continuing"

      - name: Save playlist ID
        run: |
          if [ -f sleep_playlist_id.txt ] && [ -s sleep_playlist_id.txt ]; then
            echo "Found: $(cat sleep_playlist_id.txt)"
            git config user.email "bot@aalayamani.com"
            git config user.name "Aalaya Mani Bot"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Mohan-Kumar-Swamynathan/am.git
            git add sleep_playlist_id.txt
            git diff --staged --quiet || git commit -m "chore: sleep playlist $(cat sleep_playlist_id.txt)"
            git push origin main && echo "✅ Pushed playlist ID" || echo "⚠️ Push failed"
            echo "Playlist URL: https://www.youtube.com/playlist?list=$(cat sleep_playlist_id.txt)"
          else
            echo "sleep_playlist_id.txt not found or empty"
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
          echo "=== Scripts ===" && ls -lh scripts/ 2>/dev/null || echo "none"
          echo "=== Metadata ===" && ls -lh metadata/ 2>/dev/null || echo "none"
          echo "=== Queue ===" && cat upload_queue.json 2>/dev/null || echo "none"
          echo "=== Sleep Videos ===" && ls -lh sleep_videos/ 2>/dev/null || echo "none"
          echo "=== Pexels images ===" && find pexels_images/ -name "*.jpg" 2>/dev/null | wc -l || echo "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-output-${{ github.run_number }}
          path: |
            videos/
            shorts/
            metadata/
            scripts/
            sleep_videos/
            sleep_thumbnails/
          retention-days: 7
