name: Daily Video

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST — morning prime time
    - cron: "0 16 * * *"   # 21:30 IST — evening prime time
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom topic (optional)"
        required: false
      upload:
        description: "Upload to YouTube? yes/no"
        required: false
        default: "yes"

concurrency:
  group: am-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  GEMINI_KEY:             ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
  CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
  GITHUB_TOKEN:           ${{ secrets.GH_PAT_TOKEN }}
  GITHUB_MODELS_TOKEN:    ${{ secrets.GH_PAT_TOKEN }}
  PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
  USE_STOCK_VIDEO:        "true"
  YOUTUBE_TOKEN_BASE64:   ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
  CLIENT_SECRETS_BASE64:  ${{ secrets.CLIENT_SECRETS_BASE64 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto
          pip install --quiet -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          ffmpeg -version | head -1
          edge-tts --version 2>/dev/null || python3 -c "import edge_tts; print('edge_tts OK')"
          python3 -c "import google.genai; print('google-genai OK')"
          if [ -z "$GEMINI_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GITHUB_TOKEN" ] && [ -z "$CEREBRAS_API_KEY" ]; then
            echo "ERROR: No LLM key configured"; exit 1
          fi

      - name: Setup assets
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1920, 1080), (20, 15, 40))
          d = ImageDraw.Draw(img)
          d.ellipse([810,390,1110,690], fill=(40,30,60), outline=(200,170,50))
          img.save('image.png')
          print('image.png created')
          " || true
          test -f bgm.mp3 || ffmpeg -y -f lavfi \
            -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" \
            -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" \
            bgm.mp3 2>/dev/null && echo "bgm.mp3 created"

      - name: Restore YouTube token
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle
            echo "youtube_token.pickle restored ($(wc -c < youtube_token.pickle) bytes)"
          else
            echo "WARNING: YOUTUBE_TOKEN_BASE64 not set — upload will be skipped"
          fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then
            echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
          fi

      - name: Validate YouTube token
        run: |
          SZ=$(wc -c < youtube_token.pickle 2>/dev/null || echo 0)
          [ "$SZ" -lt 100 ] && echo "No valid token — generate only" && exit 0
          python3 -c "import pickle; c=pickle.load(open('youtube_token.pickle','rb')); print('valid='+str(c.valid)+' expired='+str(c.expired)+' refresh='+str(bool(c.refresh_token)))" || echo "TOKEN_DECODE_FAILED"

      - name: Run weekly analytics
        run: python3 -c "from aalaya_mani_bot import run_analytics_loop; run_analytics_loop()" || echo "Analytics skipped"

      - name: Generate and upload
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          UPLOAD="${{ github.event.inputs.upload }}"

          if [ -n "$TOPIC" ]; then
            CMD="python3 aalaya_mani_bot.py --topic \"$TOPIC\""
          else
            CMD="python3 aalaya_mani_bot.py --day today"
          fi
          if [ -f youtube_token.pickle ] && [ "${UPLOAD}" != "no" ]; then
            CMD="$CMD --upload"
          fi
          echo "▶ Running: $CMD"
          eval $CMD 2>&1 | tee /tmp/bot.log || echo "⚠️ Bot error"

      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
          echo "=== Log tail ===" && tail -20 /tmp/bot.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am-output-${{ github.run_number }}
          path: |
            videos/
            shorts/
            metadata/
            scripts/
            thumbnails/
          retention-days: 1
          if-no-files-found: ignore
