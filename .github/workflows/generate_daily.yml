name: Aalaya Mani - Daily

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: all|today|trending|upload"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-genai groq edge-tts google-api-python-client google-auth-oauthlib requests beautifulsoup4 Pillow schedule
      - name: Run
        run: python3 aalaya_mani_bot.py --day today --upload
        env:
          CI: "true"
