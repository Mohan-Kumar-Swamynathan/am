name: Daily Video

on:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST   # 21:17 UTC = 02:47 IST
    - cron: "0 16 * * *"  # 21:30 IST   # 13:47 UTC = 19:17 IST
  workflow_dispatch:

permissions:
  contents: write

env:
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
  GITHUB_TOKEN:           ${{ secrets.GH_PAT_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
  CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto
          pip install --quiet -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          echo "=== Tool paths ==="
          which ffmpeg   && ffmpeg -version | head -1
          which ffprobe  && ffprobe -version | head -1
          which edge-tts && edge-tts --version || echo "WARNING: edge-tts not in PATH"
          python3 -c "import shutil; print('edge-tts via python:', shutil.which('edge-tts'))"
          echo "=== Python packages ==="
          python3 -c "import google.genai; print('google-genai OK')"
          python3 -c "import groq; print('groq OK')" || echo "groq not installed"
          python3 -c "import edge_tts; print('edge_tts module OK')"
          echo "=== Secrets check ==="
          echo "GEMINI_KEY set:           ${{ secrets.GEMINI_KEY != '' }}"
          echo "GROQ_API_KEY set:         ${{ secrets.GROQ_API_KEY != '' }}"
          echo "PEXELS_API_KEY set:       ${{ secrets.PEXELS_API_KEY != '' }}"
          echo "YOUTUBE_TOKEN_BASE64 set: ${{ secrets.YOUTUBE_TOKEN_BASE64 != '' }}"
          if [ -z "$GEMINI_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GITHUB_TOKEN" ] && [ -z "$CEREBRAS_API_KEY" ]; then
            echo "ERROR: No free LLM key set (need GROQ_API_KEY, GEMINI_KEY, GH_PAT_TOKEN, or CEREBRAS_API_KEY)."
            exit 1
          fi

      - name: Setup assets
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1920, 1080), (20, 15, 40))
          d = ImageDraw.Draw(img)
          d.ellipse([810,390,1110,690], fill=(40,30,60), outline=(200,170,50))
          img.save('image.png')
          print('image.png created')
          " || true
          test -f bgm.mp3 || ffmpeg -y -f lavfi \
            -i "anoisesrc=d=600:c=pink:r=44100:a=0.02" \
            -af "lowpass=f=300,equalizer=f=150:t=q:w=0.5:g=10,aecho=0.8:0.6:100|150:0.3|0.2,volume=0.3" \
            bgm.mp3 2>/dev/null && echo "bgm.mp3 created"

      - name: Restore YouTube token
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle
            echo "youtube_token.pickle restored ($(wc -c < youtube_token.pickle) bytes)"
          else
            echo "WARNING: YOUTUBE_TOKEN_BASE64 not set — upload will be skipped"
          fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then
            echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
            echo "client_secrets.json restored"
          fi


      - name: Validate and refresh YouTube token
        run: |
          if [ ! -f youtube_token.pickle ]; then
            echo "No youtube_token.pickle — video generation only, upload skipped"
            exit 0
          fi
          SZ=$(wc -c < youtube_token.pickle 2>/dev/null || echo 0)
          echo "pickle_size=${SZ}_bytes"
          if [ "$SZ" -lt 100 ]; then
            echo "ERROR: pickle missing/empty"
            exit 1
          fi
          python3 -c "import pickle; c=pickle.load(open('youtube_token.pickle','rb')); print('valid='+str(c.valid)+',expired='+str(c.expired)+',has_refresh='+str(bool(c.refresh_token)))" 2>&1 || echo "TOKEN_DECODE_FAILED"
      - name: Run weekly analytics
        run: python3 -c "from aalaya_mani_bot import run_analytics_loop; run_analytics_loop()" || echo "Analytics skipped"

      - name: Generate and upload
        run: |
          set -o pipefail
          if [ -f youtube_token.pickle ]; then
            python3 aalaya_mani_bot.py --day today --image image.png --upload 2>&1 | tee /tmp/daily_bot.log || {
              echo "=== BOT ERROR ==="
              tail -30 /tmp/daily_bot.log
              echo "================"
            }
          else
            echo "No YouTube token — generating video only"
            python3 aalaya_mani_bot.py --day today --image image.png 2>&1 | tee /tmp/daily_bot.log || echo "Bot error"
          fi

      - name: Verify image quality logs
        if: always()
        run: |
          if [ -f /tmp/daily_bot.log ]; then
            grep -E "real_photos=[0-9]+" /tmp/daily_bot.log || echo "WARNING: real_photos metric missing"
            REAL=$(grep -oE "real_photos=[0-9]+" /tmp/daily_bot.log | tail -1 | cut -d= -f2 || echo 0)
            echo "real_photos=$REAL"
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== Videos ===" && ls -lh videos/ 2>/dev/null || echo "none"
          echo "=== Shorts ===" && ls -lh shorts/ 2>/dev/null || echo "none"
          echo "=== Scripts ===" && ls -lh scripts/ 2>/dev/null || echo "none"
          echo "=== Metadata ===" && ls -lh metadata/ 2>/dev/null || echo "none"
          echo "=== Queue ===" && cat upload_queue.json 2>/dev/null || echo "none"
          echo "=== Pexels images ===" && find pexels_images/ -name "*.jpg" 2>/dev/null | wc -l || echo "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-output-${{ github.run_number }}
          path: |
            videos/
            shorts/
            metadata/
            scripts/
            thumbnails/
          retention-days: 1
          if-no-files-found: ignore
