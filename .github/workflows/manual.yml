name: ஆலய மணி — Manual / Custom Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - trending
          - all
          - upload
          - full
      topic:
        description: "Custom topic"
        required: false
        type: string
      privacy:
        description: "YouTube privacy"
        required: false
        default: "unlisted"
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-generativeai edge-tts google-api-python-client google-auth-oauthlib requests beautifulsoup4 Pillow

      - name: Run bot
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.pickle; fi
          if [ -n "$CLIENT_SECRETS_BASE64" ]; then echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json; fi
          MODE="${{ github.event.inputs.mode }}"
          TOPIC="${{ github.event.inputs.topic }}"
          PRIVACY="${{ github.event.inputs.privacy }}"
          if [ -n "$TOPIC" ]; then python3 aalaya_mani_bot.py --topic "$TOPIC" --output custom --privacy "$PRIVACY" --upload
          elif [ "$MODE" = "full" ]; then python3 aalaya_mani_bot.py --day today --upload --privacy "$PRIVACY"; python3 aalaya_mani_bot.py --trending --upload --privacy "$PRIVACY"
          elif [ "$MODE" = "all" ]; then python3 aalaya_mani_bot.py --day all --upload --privacy "$PRIVACY"
          elif [ "$MODE" = "upload" ]; then python3 aalaya_mani_bot.py --upload-pending --privacy "$PRIVACY"
          elif [ "$MODE" = "trending" ]; then python3 aalaya_mani_bot.py --trending --upload --privacy "$PRIVACY"
          else python3 aalaya_mani_bot.py --day today --upload --privacy "$PRIVACY"
          fi
